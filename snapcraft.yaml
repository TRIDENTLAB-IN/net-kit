name: net-kit
base: core24
version: "0.1.0"
summary: LAN and network diagnostic toolkit
description: |
  Net Kit is a desktop network toolkit for LAN host discovery, IP-info
  lookups, DNS, WHOIS and ASN queries.

grade: devel
confinement: strict

apps:
  netkit:
    command: bin/netkit
    plugs:
      - network
      - network-bind
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - gsettings

parts:
  netkit:
    plugin: nil
    source: .
    build-packages:
      - gcc
      - libgtk-3-dev
      - libwebkit2gtk-4.1-dev
      - wget
      - xz-utils
    override-build: |
      set -eux

      export NODE_VERSION=v20.19.1
      export GO_VERSION=1.25.4

      mkdir -p "$CRAFT_PART_BUILD/tools"
      cd "$CRAFT_PART_BUILD/tools"

      # Node.js (contains npm)
      if [ ! -d node ]; then
        wget -q "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-linux-x64.tar.xz"
        tar -xJf "node-${NODE_VERSION}-linux-x64.tar.xz"
        mv "node-${NODE_VERSION}-linux-x64" node
      fi
      export PATH="$PWD/node/bin:$PATH"

      # Go toolchain
      if [ ! -d go ]; then
        wget -q "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
        tar -xzf "go${GO_VERSION}.linux-amd64.tar.gz"
      fi
      export PATH="$PWD/go/bin:$PATH"

      export GOCACHE="$CRAFT_PART_BUILD/.gocache"
      export GOPATH="$CRAFT_PART_BUILD/gopath"
      mkdir -p "$GOCACHE" "$GOPATH"

      # Build frontend
      cd "$CRAFT_PART_SRC/frontend"
      npm install
      npm run build

      # Build Go binary (embeds frontend/dist)
      cd "$CRAFT_PART_SRC"
      go build -ldflags "-s -w" -o "$CRAFT_PART_INSTALL/bin/netkit" .
